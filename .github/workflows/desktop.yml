name: desktop-build

# FontCop 桌面版双平台构建：mac .dmg + Windows .exe（nsis 安装包）
# 手动触发（workflow_dispatch）或 desktop/** 变更时触发；产物在 run artifacts 下载
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "web/**"
      - "fonts/common_chars.txt"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
          - os: windows-latest
            label: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. 独立 Python 运行时（build-python.sh 自动按 OS/ARCH 选资产；CI bash 环境可跑）
      #    Windows 上 Git Bash 执行；产物 desktop/python-runtime/
      - name: Build python runtime
        run: bash desktop/build-python.sh
        shell: bash

      # 2. 建字形索引（打包需 data/glyph_index.npz）
      - name: Build glyph index
        run: ./desktop/python-runtime/bin/python3 -m src.indexer
        shell: bash
        # Windows 路径不同
        if: matrix.label != 'win'

      - name: Build glyph index (win)
        run: desktop/python-runtime/python.exe -m src.indexer
        shell: bash
        if: matrix.label == 'win'

      # 3. Electron 依赖 + electron-builder 打包
      - name: Install electron deps
        working-directory: desktop
        run: npm install

      - name: Build app
        working-directory: desktop
        run: npx electron-builder --${{ matrix.label == 'mac' && 'mac' || 'win' }}
        env:
          # 未配签名证书时跳过 macOS 代码签名（本地右击打开即可用）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 4. 上传产物
      - name: Upload artifacts (mac)
        if: matrix.label == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: FontCop-mac
          path: |
            desktop/dist/*.dmg
          if-no-files-found: error

      - name: Upload artifacts (win)
        if: matrix.label == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: FontCop-win
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
