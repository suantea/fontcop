name: Build Windows exe

on:
  workflow_dispatch: {}        # 手动触发
  push:
    tags: ["v*"]               # 打 tag 时自动构建

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy scipy fonttools pystray pyinstaller rapidocr-onnxruntime

      - name: Build glyph index
        run: python -m src.indexer

      - name: Build exe
        run: pyinstaller --clean --noconfirm FontCop.spec

      - name: Smoke test (server responds)
        run: |
          Start-Process -FilePath "dist\FontCop.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 40
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:8642/api/fonts" -UseBasicParsing
          if ($r.StatusCode -ne 200) { exit 1 }
          Write-Host "smoke test OK: $($r.Content.Substring(0,80))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FontCop-windows
          path: dist/FontCop.exe
          retention-days: 30
